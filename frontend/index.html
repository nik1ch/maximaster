<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Каталог</h1>
    </div>
  </header>

  <main class="page-content">
    <section class="section-header">
      <div>
        <h2>Список картин</h2>
        <div class="category-list" aria-label="Категории картин">
          <button class="category-button active" type="button" data-category="Все">Все</button>
          <button class="category-button" type="button" data-category="Пейзажи">Пейзажи</button>
          <button class="category-button" type="button" data-category="Портреты">Портреты</button>
          <button class="category-button" type="button" data-category="Натюрморты">Натюрморты</button>
          <button class="category-button" type="button" data-category="Морские виды">Морские виды</button>
        </div>
      </div>
      <a class="button" href="admin/index.html">Открыть админку</a>
    </section>

    <section class="catalog-grid" aria-label="Картины" data-catalog-list></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
