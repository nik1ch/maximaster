<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Каталог</h1>
    </div>
  </header>

  <main class="page-content">
    <section class="section-header">
      <div>
        <h2>Список картин</h2>
        <div class="category-list" aria-label="Категории картин">
          <button class="category-button active" type="button">Все</button>
          <button class="category-button" type="button">Пейзажи</button>
          <button class="category-button" type="button">Портреты</button>
          <button class="category-button" type="button">Натюрморты</button>
          <button class="category-button" type="button">Морские виды</button>
        </div>
      </div>
      <a class="button" href="admin/index.html">Открыть админку</a>
    </section>

    <section class="catalog-grid" aria-label="Картины">
      <article class="painting-card">
        <div class="painting-preview preview-blue"></div>
        <div class="painting-info">
          <h3>Звездная ночь</h3>
          <p>Винсент ван Гог, 1889</p>
          <div class="actions">
            <a href="details.html?id=1">Подробнее</a>
          </div>
        </div>
      </article>

      <article class="painting-card">
        <div class="painting-preview preview-green"></div>
        <div class="painting-info">
          <h3>Утро в сосновом лесу</h3>
          <p>Иван Шишкин, 1889</p>
          <div class="actions">
            <a href="details.html?id=2">Подробнее</a>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
