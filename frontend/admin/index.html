<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка каталога картин</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Открытая админка</p>
      <h1>Управление картинами</h1>
    </div>
  </header>

  <main class="page-content">
    <section class="section-header">
      <div>
        <h2>Записи каталога</h2>
        <p>HTML-прототип будущего списка для создания, редактирования и удаления картин.</p>
      </div>
      <div class="section-actions">
        <a class="button secondary" href="../index.html">В каталог</a>
        <a class="button" href="create.html">Добавить картину</a>
      </div>
    </section>

    <section class="admin-panel" aria-label="Таблица картин">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Название</th>
            <th>Автор</th>
            <th>Год</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Звездная ночь</td>
            <td>Винсент ван Гог</td>
            <td>1889</td>
            <td class="actions">
              <a href="../details.html?id=1">Просмотр</a>
              <a href="edit.html?id=1">Изменить</a>
              <button type="button" data-action="delete">Удалить</button>
            </td>
          </tr>
          <tr>
            <td>Утро в сосновом лесу</td>
            <td>Иван Шишкин</td>
            <td>1889</td>
            <td class="actions">
              <a href="../details.html?id=2">Просмотр</a>
              <a href="edit.html?id=2">Изменить</a>
              <button type="button" data-action="delete">Удалить</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
