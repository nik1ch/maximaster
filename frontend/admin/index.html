<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка каталога картин</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Открытая админка</p>
      <h1>Управление картинами</h1>
    </div>
  </header>

  <main class="page-content">
    <section class="section-header">
      <div>
        <h2>Записи каталога</h2>
        <p>Список загружается из API и сохраняется в JSON-файл.</p>
      </div>
      <div class="section-actions">
        <a class="button secondary" href="../index.html">В каталог</a>
        <a class="button" href="create.html">Добавить картину</a>
      </div>
    </section>

    <section class="admin-panel" aria-label="Таблица картин">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Изображение</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Год</th>
            <th>Категория</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody data-admin-list></tbody>
      </table>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
