<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить картину</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Админка</p>
      <h1>Добавить картину</h1>
    </div>
  </header>

  <main class="page-content narrow">
    <form class="form" data-form="painting">
      <label>
        Название
        <input type="text" name="title" placeholder="Например: Девятый вал" required>
      </label>

      <label>
        Автор
        <input type="text" name="artist" placeholder="Например: Иван Айвазовский" required>
      </label>

      <label>
        Год
        <input type="number" name="year" placeholder="1850" required>
      </label>

      <label>
        Категория
        <select name="category" required>
          <option value="">Выберите категорию</option>
          <option value="Пейзажи">Пейзажи</option>
          <option value="Портреты">Портреты</option>
          <option value="Натюрморты">Натюрморты</option>
          <option value="Морские виды">Морские виды</option>
        </select>
      </label>

      <label>
        Описание
        <textarea name="description" rows="5" placeholder="Краткое описание картины" required></textarea>
      </label>

      <label>
        Ссылка на изображение
        <input type="url" name="imageUrl" placeholder="https://example.com/painting.jpg">
      </label>

      <label>
        Файл изображения
        <input type="file" name="imageFile" accept="image/*">
      </label>

      <div class="image-form-preview" data-image-preview></div>

      <div class="form-actions">
        <button class="button" type="submit">Сохранить</button>
        <a class="button secondary" href="index.html">Отмена</a>
        <a class="button secondary" href="../index.html">В каталог</a>
      </div>
    </form>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
